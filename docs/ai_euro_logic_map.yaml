      - id: skip_job
        kind: decision
        label: Mid Pioneer job (CLEAR_PLOW / BUILD_ROAD)?
        status: linux
        note: Port guard — pilot state is fresh each turn, so a multi-turn job would otherwise be hijacked.
      - id: skip_state
        kind: decision
        label: "order 'A' → clear; act_state ≥10, or act_state ∉ {0,5,6} → skip; stale 't'/'i' → '?'"
        dos: 0a60 tail order-code / act-state gates (unit+0x314b/+0x314c)
        status: structural
      - id: presence
        kind: decision
        label: Land Soldier/Dragoon whose continent has <3 land units (or <2 and no colony)?
        fn: ai_euro.c:ai_euro_0a60_continent_presence
        status: dos
        note: Home-defense hold — unit keeps no goal.
      - id: scan
        kind: loop
        label: "Scan primary slots — capability bit test `(1 << (goal.code & 0x1f)) & DS:0x523d[type*0xe]`, then the two unit+0x3148 clauses, same continent for land"
        fn: ai_euro.c:ai_euro_0a60_unit_can_pursue_goal
        dos: FUN_521d_0a60 raw 88184-88191
        status: dos
        note: "act_state 5/6 land units skip when standing in any Euro colony (FUN_137f_0358 euro_settlement_owner on the unit's own tile). Pick: score < best && score/weight_seed <= prio*3/2. FIXED 2026-09-18 (bugs.md #511): the gate was keyed on unit NAMES; DOS indexes the type's NAMES.TXT @UNIT capability byte (k_20e6_type_flags) with the GOAL CODE as the bit index. Consequence, and it is DOS's: FOUND(1) and MIL_EXPAND(7) live only on the ship rows 0x81/0x82/0xa2 — they are transport goals — while land rows carry ESCORT(2)/LABOR(3)/MILITARY(4)/COLONY(5) and Colonist/Pioneer (0x40) carry only bit 6 (EXPLORE, a code the primary table never holds). The two extra clauses stay: code 1 also needs unit+0x3148 bit2, code 7 also needs bit3. A pool whose types did not come from NAMES.TXT (dos_type −1, hand-built test tables only) falls back to the old name-keyed equivalent."
      - id: commit
        kind: step
        label: "Commit best slot: +0x314b order '1' (FOUND 't', MIL_EXPAND 'i'), +0x314c = 0x0b, +0x314d/e = goal tile; claim-count++ unless MILITARY"
        fn: ai_euro.c:ai_euro_0a60_goal_orders_structural
        status: structural
        note: "2026-09-18f (bugs.md #525): the commit writes the REAL unit bytes now (u->col1_ai_plan / u->orders / u->goto_x / u->goto_y via ai_euro_set_goto), not the retired s_0a60_pilot_state mirror, so the 20e6 pre-LAB_4d2e gate and the act-level arms see the same course the rest of the port sets. LAND ONLY, and that is a port divergence: DOS binds ships here too (a 0x0b transport whose DS:0x523d bit0 is clear skips 20e6 outright and just walks the goal), but binding them moves every AI transport off its landfall onto this port's own 0a60 ocean-tile FOUND/CONTACT producers and loses four of the six real DOS save pairs in golden_ai_turns — i.e. the SHIP half of the goal table is not faithful enough yet. Open lead. The AI_GOAL_* code itself has no DOS byte at all: `ai_goals_primary_code_at` re-reads it from the goal table at +0x314d/e, and ai_euro_unit_act captures the binding before 20e6's LAB_589e wander commit can overwrite +0x314c with 0x0c."
      - id: end
        kind: end
        label: "return (unit_act reads +0x314b/c/d/e back off the unit)" 
