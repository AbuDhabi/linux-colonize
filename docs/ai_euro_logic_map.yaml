        dos: FUN_5952_035e raw 94370-94400 (+ FUN_5952_0000 raw 93589-93685), raw 94402-94551
        status: dos
        note: "Three consecutive arms, all sharing the tick-local local_16 = `0x13 < colony+0xb6` (20+ tools). (1) bugs.md #640, raw 94370-94388: when ((+0x1b & 0x80) || turn % 10 == 0) && !local_16, buy 20 tools at DS:0x84ca[nation*0x10]. That address is NOT a separate table — 0x84ca == DS:0x84bc + 0x0e, so it is the already-ported per-nation SELL price row (AiEuro5952Want.sell_price, writers store `euro_price - 1`) read at cargo 0x0e = Tools; the purse test is the 32-bit gold at *0x84fc+0x2a/0x2c. (2) bugs.md #641, raw 94389-94400: on local_16 && turn % 7 == 0 (NOT gated on +0x1b bit 0x80) call FUN_5952_0000 (ai_euro_5952_road_connect_0000) — needs 2+ own colonies on this continent (DS:0x94e6[nation*0x10+cid] > 1), picks another own colony that is within 6 on at least one axis and on the same continent, rolls FUN_281f_04d4(0, count-2) == 0, walks the FUN_6662_00f2 pathfinder toward it (DS:0x1dd2=1, 0x1dd4=1, 0x1dd6=-1) until a tile with no settlement (06be) and no road/settlement bits (0754 & 0x0a) appears, rejects it if occupied (06d2) or improved by an at-peace Euro rival (06e6 = 137f_044a, euro_relation bit 0x40), aborts the whole helper when colony+0x8c < DS:0x2f78[class*0x10] + 2, else spawns the DS:0x524e phantom with +0x315a = 99 and runs FUN_479b_0526. On success the caller charges min(stock,20) tools and clears +0x8c. (3) bugs.md #612, raw 94402-94551: ai_euro_5952_improve_best_plot, gated on +0x1b bit 0x80 && local_16 && turn % 7 != 0."
      - id: pass1
        kind: loop
        label: "Pass 1 — food: re-score the slots that were feeding the colony until food_have ≥ food_need"
        fn: ai_euro.c:ai_euro_28c8_score_job
        dos: FUN_15eb_28c8 job scorer (9-job formula); colony+0x9a food stock
        status: dos
        note: "Scorer fixes 2026-09-22: #579 — every plot walk now gates on the FUN_15eb_23f2 blocked bitmask (colonies_plot_blocked_mask, DS:0x8df0, raw 12993) for human AND AI colonies; the Indian-claim table at -0x7262 stays the separate human-only test. #584 — the walk runs in the DS:0xc8/0xde table order (N,E,S,W,NW,NE,SE,SW) via colonies_field_scan_order, because the election at raw 13126 is strictly greater so the earliest table index wins ties. #582 — raw 13000 passes param_4 = 0 to FUN_15eb_18ec, so local_24 stays the JOB index and a Fisherman clamps/weights against cargo slot 8 (HORSES), a DOS quirk kept literal. bugs.md #585 (2026-09-22): the DS:0x8dbe best-yield stop (raw 94596) is INSIDE the `FUN_281f_0b6e() == 0` arm. A non-zero 28c8 return means \"not handled\" and only advances to the next colonist (`local_ac++`); only a handled call with best yield < 3 ends the whole placement section. The port used to break the section on either. Same shape in pass 2 (raw 94612-94614). LAB_5952_178f is not an early return: raw 94623-94627 falls into the rest of the tick either way, so the indoor pass still re-seats whoever the passes left over."
      - id: pass2
        kind: loop
