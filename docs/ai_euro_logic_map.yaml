        label: Wagon — haul (load matrix, 457e origin walk, village errand, 47b9)
        fn: ai_euro.c:ai_euro_try_wagon_haul
        dos: 20e6 wagon arms (iStack_34==0), LAB_457e origin walk, 8d4a village errand
        status: dos
      - id: pioneer
        kind: step
        label: "Pioneer — order 9 (Build Road) park, unless a village claims the tile or a foreign colony is within 3"
        fn: ai_euro.c:ai_euro_move_scoring_gate
        dos: FUN_521d_20e6 raw 90183-90206 (dup raw 85345-85368)
        status: dos
        note: "bugs.md #610/#611: the old node was the INVENTED planner ai_euro_try_pioneer_improve (Colonization.pdf-cited colony-ring scan, plow-before-road, MD<=3, prefer-Hardy), deleted 2026-09-22. DOS's only AI pioneer unit order is this one: at the land commit point a type-2 unit that is not the iStack_6a explorer pick writes +0x314c = 9 / +0x314b = 0x52 and leaves 20e6 (goto LAB_5a78). Nothing in the image then ticks that order for an AI unit — the sole callers of FUN_479b_01a6/0526 are the human ORDERS UI (raw 42512/42603) and the colony tick's phantom-unit sites (raw 93669, raw 94520/94534) — so the write is a park. Real AI tile improvement happens in FUN_5952_035e raw 94402-94551 (ai_euro_5952_improve_best_plot, bugs.md #612), which is a colony-tick arm and therefore not on this unit graph."
      - id: fortify
        kind: step
        label: "Peace fortify — armed land unit (DS:0x5236[type] > 1, type outside 0xd..0x12) on own colony → FORTIFY"
        fn: ai_euro.c:ai_euro_act_land_fortify
        dos: FUN_521d_20e6 raw 89011-89013 (the 'F' = 0x46 arm's unit test)
        status: structural
        note: "FIXED 2026-09-18 (bugs.md #512): the arm's own unit test is now DOS's — the NAMES @UNIT ATTACK column above 1 (loader raw 121115-121119 stores col3 attack at 0x5236, col4 defense at 0x5235) plus not-a-ship-type — instead of name matching, and it spends no garrison quota to fire (DOS's arm has no quota concept; the colony's quota is still decremented so the other quota readers see the garrison). NOT ported from that DOS arm: its remaining guards — local_ea (an adjacent attackable foreigner was seen earlier in the act), FUN_281f_098e == FUN_281f_02ee (the +0x315c and +0x315e stack-chain walks agree, i.e. the unit is alone in its stack) and the 8-neighbour FUN_281f_0696 scan for a Euro colony owned by another nation. Those belong to a DIFFERENT trigger (park beside a foreign border colony) than this port arm's own-colony garrison, so bolting them on would suppress ordinary AI garrison fortification; that trigger is ported separately 2026-09-18 as ai_euro_20e6_border_park_arm (move_scoring_gate graph, node border_park)."
      - id: pilot
        kind: step
        label: Read 0a60 pick (act_state 0xb)
        fn: ai_euro.c:ai_euro_act_land_goal_consume
        status: structural
        note: "2026-09-18: the threatened-Stockade LABOR override and its ai_euro_colony_threatened_by_war helper were deleted as invented — the goal table is written only by FUN_521d_0a60 and the one AI construction picker is the FUN_5952_035e cascade, neither of which has a war-proximity term."
      - id: labor
        kind: step
        label: LABOR bind ladder — carpenter hammers, lumber, tools-short Pioneer, food labor, Free Colonist; MD≤8
        status: linux
      - id: found_now
        kind: decision
        label: FOUND goal and standing on its tile?
      - id: found
        kind: step
        label: Found colony with this unit
        fn: ai_euro.c:ai_euro_found_with_unit
        dos: 5b66 case 7 FOUND
        status: dos
      - id: found_near
        kind: decision
        label: No goal, founder type, best FOUND tile adjacent?
        fn: ai_goals.c:ai_goals_best_found_tile_near
      - id: on_colony
        kind: step
        label: Own colony arrival — no unit-act outcome (join/TOOLS-delivery arms deleted)
        fn: ai_euro.c:ai_euro_act_land_goal_dispatch
        dos: >-
          No unit-act join: 20e6's +0x314b vocabulary (raw 88266-89800) has no
          join outcome, 0a60's own-colony block only marks 'A' (raw
          87683-87756), and absorption is FUN_5952_035e's tile re-scan (raw
          94231-94274, ai_euro_5952_absorb_equip). The wagon/pioneer TOOLS
          delivery and wagon Europe dump-sell arms were manual-cited
          inventions, deleted 2026-09-18; DOS wagon delivery is the 20e6
          arrival block (raw 3007-3012) in ai_euro_try_wagon_haul.
