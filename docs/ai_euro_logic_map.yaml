      - id: war_hunt
        kind: step
        label: War — wake passive hunter, seize adjacent colony/village, attack adjacent foe
        fn: ai_euro.c:ai_euro_land_engage_adjacent
        status: thin
        note: "2026-09-18: the distant land war hunt (ai_euro_land_war_hunt_target) was deleted as invented — DOS has no distant land hunt, exactly as it has none for ships. The adjacent-attack loop (ai_euro_land_try_adjacent_attack / ai_euro_land_best_adjacent_foe) is kept and marked a GOLDEN-BACKED STAND-IN: DOS scores an adjacent foe inside the LAB_521d_4d2e attack term (raw 88880-88940) and resolves it via FUN_465b_0000, but the port's copy of that term needs owner >= 0 && at_war from the destination's layer3 nibble, so a foe on an unclaimed tile is never scored; deleting the pair left golden_woi_ref01's REF unable to reduce two defended colonies. 2026-09-18b (bugs.md #521): two DOS divergences behind that stall were fixed — the LAB_52aa WoI gate (raw 88883-88885: during WoI an attack is scored only on a human-controlled player slot or a tribe, not the port's `!woi || owner < 0`) and the best-defender rule of FUN_465b_0000 / FUN_5fef_0000 in ai_euro_score_move and the goal-dispatch drain loop (a berthed foreign hull was hiding a colony garrison). Without the stand-in the REF now leaves 1 surviving colony instead of 2; the residue is volume, not reachability — on land every @UNIT col9 byte is 0 so the LAB_52aa odds core is 0 for any 2+ defender stack, and the assault must come from the 0a60 MILITARY goal walk, whose binding this port drops the moment the unit stands adjacent (0a60 housekeeping sets act_state 10, raw 87566-87568, and the goal tail reads a goal only at act_state 0x0b). 2026-09-18c: act_state 10 decoded and the lead closed — FUN_521d_0a60 raw 87567 is its only writer in the game and it marks 'a foreign unit or settlement stands on one of my eight neighbours' (FUN_521d_0906 via FUN_281f_0682/06be, filtered by FUN_521d_0896 which passes any Euro owner). DOS gives such a unit no goal (raw 88164 assigns only at 0/5/6), admits it into 20e6 (raw 88404-88406), sends it straight to LAB_521d_4d2e with no goal pathing (raw 90210-90214) and demotes it to 5 with order code '0' at the tail (raw 90399-90404, now ported at every ai_euro_move_scoring_gate exit); FUN_521d_5b66 dispatches a goal only at 0x0b (raw 90552) and its switch case 10 (raw 91195) is unreachable. So DOS unbinds the adjacent unit exactly as this port does and the goal walk is NOT the assault route. Case 0 of FUN_1427_0d38 confirmed byte-exact from the 1427:0d78 jump table as 'DI += DS:0x5239[type*0xe]', so the 0-odds-vs-2+-stack behaviour is DOS's own. Also fixed here: the uncited at-war land-hunter early return in ai_euro_move_scoring_gate (20e6 has no war gate) and the drain loop's nation-blind units_id_at fallback, which handed an own unit on the step tile to ai_euro_try_attack and froze REF columns two tiles short — with the stand-in all seven colonies now fall at t15 (was t21). Lead (c) refuted: raw 88686 is an inert ship/ocean skip gate, not the normal-branch test (that is raw 88774-88776 and already matches). 2026-09-18e (bugs.md #522/#523): the reachability half is now fixed — the gate's two missing DOS act-state tests (own-colony garrison arm raw 88584-88612, pre-LAB_4d2e gate raw 90210-90219) are ported, the three uncited early returns they replaced are gone, and golden_woi_ref01's land arms now take 118 wander steps where they took 0. It did not retire the stand-in: with ai_euro_land_try_adjacent_attack disabled the REF parks beside the human colonies (1368 border-park exits) and 2 colonies survive, because the LAB_52aa odds core still scores 0 against every 2+-defender land stack and local_ce is therefore never set. With the stand-in the war now ends at t11 (@LOSING3 surrender) instead of t15-t17. #523 is REFUTED: `goto LAB_521d_5183` out of the Soldier/Dragoon colony-mass gate is the direction loop's own increment, not an exit from the scan — viceroy_overlays.asm LAB_OVL14_L0000__005183 is `INC word ptr [BP-0x4e]` followed by `CMP [BP-0x4e],0x8 / JL`, with 14 XREFs; the port's per-tile skip already matches. 2026-09-18f (bugs.md #525/#526): FUN_521d_5b66 fully decoded off its own 198 bytes (see the move_scoring_gate graph, node goal_walk) and the port now walks the unit's stored +0x314d/e instead of re-deriving a nearest FOUND tile on every act; the 0a60 shadow is retired and the raw 90210-90219 gate reads the real +0x314c. It does not retire the stand-in either: with ai_euro_land_try_adjacent_attack disabled golden_woi_ref01 still leaves 1 colony standing and never latches the endgame (with it, endgame=2 at t16). The LAB_52aa odds core scoring 0 against every 2+-defender land stack remains the sole blocker and still needs a DOSBox-X trace. 2026-09-22 CLOSED (bugs.md #521): the 0-odds core was a port column slip — ai_euro_20e6_unit_col9 read the @UNIT guns column (0x523b) instead of 0x5239 = the cost column (loader raw 121115-121135), which is non-zero for every land type. With the real column the 4d2e attack term assaults stacked colonies on its own; the adjacent-attack stand-in pair is deleted, the drain loop steps straight into an adjacent foreign-held goto tile (the 4d2e pick) instead of re-scoring it, and owner −1 tiles enter the Euro arm as DOS does (raw 88877 `local_10 < 4`)."
      - id: peace_border
        kind: step
        label: "(retired 2026-09-23, bugs.md #760) — pass-through, no DOS peace border wake"
        status: linux
        note: "The peace colony-defence wake (garrison or Artillery on its own colony wakes and hunts a foreign Euro land unit within MD<=2) was deleted as invented: manual-only citation (Colonization.pdf 'Defending a Colony'), and FUN_521d_20e6 raw 88266-90445 has no MD<=2 threat scan. DOS's own-colony handling is the type-agnostic LAB_5899 garrison arm (raw 88584-88612, node fortify / ai_euro_20e6_land_arms). The ctx flag peace_border_hunted is now always 0; its six unit tests were deleted with the arm."
      - id: treasure
        kind: step
        label: Treasure — cash at any own colony (20e6 arm 1), else walk to nearest own colony (arm 2) / own unit (arm 3), else 47b9 destroy
        fn: ai_euro.c:ai_euro_20e6_treasure_cash_in
        dos: 20e6 treasure band raw 89997-90040 (iStack_2e==0 cash-in first, then LAB_4701 / LAB_27f5 / LAB_47b9)
        status: dos
        note: "Whole band literal 2026-09-23 (bugs.md #745/#746). Cash-in is untaxed, any own colony, coastal or not; arm 2 walks to the NEAREST own colony on the same landmass with no coastline term; arm 3 walks to the nearest own unit on the landmass, else destroys when the adjacent-claim probe names the human. The Europe-cash / board-ship / coast-target / Cortes-galleon cluster was deleted: no DOS site boards an AI treasure (FUN_4720_049e has no 0x0a term) and the King-galleon offer is human-control gated (FUN_465b_0000 raw 75800)."
