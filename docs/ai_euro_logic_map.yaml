  - id: goal_orders
    title: Goal consumption — ai_euro_0a60_goal_orders_structural (0a60 tail)
    entry: weight
    nodes:
      - id: weight
        kind: step
        label: Weight seed = clamp(all_unit_counts[nation] >> 3, 3, 99) for every primary slot
