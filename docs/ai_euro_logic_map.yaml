        kind: decision
        label: "0x46 park — pick is not an attack (local_ce == 0), an attackable foreigner was seen (local_ea), the unit is alone in its tile chain and a Euro settlement of another nation stands on one of its own 8 neighbours → stay"
        fn: ai_euro.c:ai_euro_20e6_border_park_arm
        dos: FUN_521d_20e6 raw 89011-89029 (LAB_4d2e tail, asm OVL14_L0000:0x005992-0x005a31)
        status: dos
        note: "Ported 2026-09-18 (bugs.md #512). The LAB_4d2e tail runs local_ce == 0 (asm 0x5840) → local_8e == 0 (asm 0x5876) → the 0x42 / 0x65 pioneer codes (raw 88989-89009, act-level in this port) → this arm → the 0x39 fallthrough (asm 0x586a); every failed sub-test jumps straight to 0x586a. The two chain walks have their far-call args dropped by Ghidra — the asm at 0x59c9 passes the unit index in AX, FUN_1000_8b7e = FUN_281f_098e = FUN_1427_0026 (walk +0x315e to the tail) and FUN_1000_84de = FUN_281f_02ee = FUN_1427_0002 (walk +0x315c to the head), so tail == head is exactly 'alone in the chain' (units_map_stack_chrome). The arm issues no FORTIFY order and no goto: +0x314b is the AI annotation byte and no DOS reader compares it against 0x46, so the whole effect is LAB_5899's local_76 = 8 — the scored wander step is dropped. It spends no garrison quota and needs no colony of its own nearby. Unreachable in the current goldens (the land arms branch of the gate is never taken in golden_ai_turns / smoke_ai_* / golden_woi_ref01), so it changes no golden counter; covered by the four unit_border_park_* cases in tests/unit/test_ai_euro_20e6.c."
      - id: score
        kind: step
        label: score_move toward target → set AI_MOVE goto
        fn: ai_euro.c:ai_euro_score_move
      - id: ret0
        kind: end
        label: return 0 (act continues)
      - id: ret1
        kind: end
        label: return 1 (act aborted)
    edges:
      - [is_sea, ret0, "yes"]
      - [is_sea, garrison, "no"]
      - [garrison, ret0, "hold: LAB_5899 (order 'A', or < 2 armed in the chain)"]
      - [garrison, prologue, "surplus: local_8e = 1, raw 88612 goto LAB_4d2e"]
      - [garrison, no_colony, "not an own-colony garrison: LAB_277a"]
      - [no_colony, score, "yes: own tile"]
      - [no_colony, gate_4d2e, "no"]
      - [gate_4d2e, prologue, "yes: goto LAB_521d_4d2e"]
      - [gate_4d2e, goal_walk, "no: LAB_5a78 tail, 5b66 case 0x0b/0x0c walks the goal"]
      - [goal_walk, score, "target in +0x314d/e"]
      - [goal_walk, ret0, "no target: LAB_5a78 tail only"]
      - [prologue, patrol]
      - [patrol, ret0, "handled"]
      - [patrol, village, "no"]
      - [village, ret0, "handled"]
      - [village, labor, "no"]
      - [labor, ret0, "handled"]
      - [labor, recall, "no"]
      - [recall, ret0, "handled"]
      - [recall, explore, "no, explorer"]
      - [recall, wander, "no, not explorer"]
      - [explore, score, "target"]
      - [explore, wander, "no target, no hop"]
      - [wander, surplus_tail]
      - [surplus_tail, ret0, "yes: LAB_5888 garrison hold"]
      - [surplus_tail, border_park, "no"]
      - [border_park, ret0, "yes: stay (LAB_5899 local_76 = 8)"]
      - [border_park, score, "no"]
