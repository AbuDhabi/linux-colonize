  # ---------------------------------------------------------------------
  - id: move_scoring_gate
    title: Move-scoring gate — ai_euro_move_scoring_gate (FUN_521d_20e6 land path)
    entry: is_sea
    nodes:
      - id: is_sea
        kind: decision
        label: Ship?
        fn: ai_euro.c:ai_euro_move_scoring_gate
        note: Ships never retarget here — courses owned by the ship band.
      - id: garrison
        kind: decision
        label: "Own-colony garrison — non-hauler type with @UNIT attack > 1, type not 4/8, standing on an own colony whose labor_shortage (+0x8e) >= 1 or order 'A'"
        fn: ai_euro.c:ai_euro_move_scoring_gate
        dos: FUN_521d_20e6 raw 88584-88612
        status: dos
        note: "Ported 2026-09-18e (bugs.md #522). Replaces three uncited early returns that used to stand here — 'passive colony Artillery', 'military name on own colony' and 'colony wants construction labor' — siblings of the at-war bail deleted 2026-09-18b; they parked every armed unit standing on one of its own colonies, so the whole land-arms branch (and with it the LAB_4d2e attack term) was unreachable for exactly the units that fight. DOS: order 'A' stays (LAB_5899); fewer than two armed units in the tile chain (attack > 1, type not in [0xd,0x12], not 4, not 8) garrisons — colony.labor_shortage--, order_code 0x47, stay; two or more sets local_8e = 1 and falls straight into LAB_4d2e, skipping LAB_277a and every arm hanging off it. local_2e == 0 ('distance to the nearest own colony is zero') is how DOS spells 'standing on an own colony'; colony +0x8e is labor_shortage; types 4 (Dragoons) and 8 (Cavalry) never garrison and are not counted. 2026-09-22 (bugs.md #554): every LAB_5899 stay of this arm now exits through the shared tail LAB_521d_589e (raw 90378-90386, ai_euro_20e6_stay_tail_589e): +0x314f = 8 and +0x314c forced into the fortify family (5, or 6 when +0x3148 & 2), so a garrison unit that still carries a stale course is no longer dispatched by the goal drain, which keys on +0x314c alone. DOS leaves +0x314d/e untouched on this arm."
      - id: no_colony
        kind: decision
        label: Nation has no colony and unit is a Pioneer/Colonist? — local 06ae-shaped pick used as this act's walk target only
        dos: FUN_521d_06ae settle-where-landed
        note: "bugs.md #708, 2026-09-23: the `ai_goals_upsert_primary(nation, lx, ly, AI_GOAL_FOUND, 7)` this arm used to write is deleted. FUN_521d_20e6 contains no goal-table writer anywhere in its body — the tables are written only by FUN_521d_0a60 and the 0906 producers — and the priority 7 was a bare constant with no DOS origin. The 06ae-shaped local pick is kept as the walk target for this act (part of the #530 fitted opening scaffolding, untouched here)."
      - id: gate_4d2e
        kind: decision
        label: "Pre-LAB_4d2e gate — courseless unit, or a foreigner on one of the eight neighbours?"
        dos: FUN_521d_20e6 raw 90210-90219
        status: dos
        note: "Ported 2026-09-18e (bugs.md #522) — the root cause of the land arms never being entered. DOS: `if (act_state != 0 && != 10 && != 5 && != 6 && (act_state != 0x0b || +0x314d != x || +0x314e != y)) { if (FUN_281f_0984(x, y, continent) == 0) goto LAB_521d_5a78; } goto LAB_521d_4d2e;` — a courseless unit (0/5/6), one flagged 'a foreigner stands on one of my eight neighbours' (10) and a goal-bound unit already standing on its goal tile ALWAYS free-score their neighbours; a goal-bound unit whose goal lies elsewhere free-scores only when FUN_281f_0984 (-> FUN_1427_09dc) finds a foreign unit or colony adjacent, and otherwise leaves 20e6 for FUN_521d_5b66 to walk the goal. The port had no such test and coursed every land unit at the nearest FOUND goal instead: instrumented over golden_woi_ref01, 284 of 460 gate calls were FOUND courses, 176 early returns and ZERO wander steps. 2026-09-18f (bugs.md #525): the test now reads the unit's REAL +0x314c/+0x314d/e. The Col1 unit record is 0x1c bytes based at DS:0x3144, so +0x3148/+0x3149/+0x314b/+0x314c/+0x314d/e ARE ColonizeUnit.col1_flags15 / moves (spent) / col1_ai_plan / orders / goto_x / goto_y, and the port's @ORDERS constants are the DOS act-state bytes themselves (7/8/9 = FUN_521d_5b66 switch cases 7/8/9, UNITS_ORDER_AI_SAIL 11 = 0x0b 'pursuing +0x314d/e', UNITS_ORDER_AI_MOVE 12 = 0x0c 'one committed step'). The file-local `s_0a60_pilot_state` mirror of those bytes is retired; `ai_euro_has_useful_goto` is now a spelling of the DOS test rather than a stand-in for it, because every course — 0a60's goal commit included — stamps the real bytes. One deliberate divergence: DOS also sends act_state 1/2/3 to the tail, but its 1 means 'aboard ship / off-map' (this port keeps that in aboard_ship_id) while the port's orders 1 is SENTRY, an on-map parked unit that must still free-score."
      - id: goal_walk
        kind: step
        label: "Walk the unit's OWN goal — score_move toward +0x314d/e"
        fn: ai_euro.c:ai_euro_move_scoring_gate
        dos: FUN_521d_5b66 case 0x0b/0x0c -> FUN_479b_0972 (raw 77052-77120)
        status: dos
        note: "bugs.md #526, 2026-09-18f. On the `goto LAB_521d_5a78` side 20e6 sets NO course at all: DOS leaves the unit bound to the goal already in +0x314d/e and FUN_521d_5b66's switch walks it. The real dispatcher is 198 bytes at OVL14 0x5b66 (viceroy_overlays.asm ~139884-139975): entry `if (+0x3149 == 0 || +0x314c != 0x0b) -> 20e6` (0x3149 is the SPENT byte, zeroed at the day top raw 6357), else `DS:0x523d[type*0xe] & 1` — set only on the warship rows 16/17/18 — decides whether the 0984 adjacency probe can divert it into 20e6 (and, at order code 'E', decrement DS:0x9456[nation]); every other 0x0b unit SKIPS 20e6 entirely. Then `switch (+0x314c)` over 7..12 via the CS jump table at 0x5c2a: 7 -> FUN_1000_93ea = FUN_479b_076e (found colony), 8 -> 0x93b2 = FUN_479b_01a6 (clear/plow), 9 -> FUN_1000_9406 = FUN_479b_0526 (road), 0x0b and 0x0c -> FUN_1000_96aa = FUN_479b_0972 (the goal walk), 0x0a and every out-of-range value -> FUN_1000_8b24 = FUN_281f_0934 (finish the unit). FUN_479b_0972 itself: set DS:0x1dd6 (0xffff for 0x0c, else the unit's nation nibble), ask FUN_2a1f_0210 = FUN_6662_0f74 (the pathfinder) for one step toward +0x314d/e, move via FUN_2a1f_0142 = FUN_465b_0000 (or FUN_291f_044e for a control-0 player), bail keeping the binding unless the unit now stands on the goal; on arrival enter a terrain-0x1a settlement, reset the type-2 ring latch, and for 0x0b finish the unit and clear +0x314c (0x02 and 0x0c keep theirs). The port's `ai_euro_score_move` + the goal-dispatch drain loop stand in for that walk; this node is only about WHICH tile it is aimed at. A `ai_goals_best_found_tile_near` re-derive stood here and re-aimed every already-bound land unit at the nearest top-priority FOUND tile on every act, so no unit ever finished a walk — deleted: FOUND (code 1) is a ship-only capability bit (bugs.md #511) and the only writer of a unit's goal is FUN_521d_0a60's consumption tail."
