        dos: 20e6 colonist labor loop (fort-capacity wanted size)
        status: dos
      - id: recall
        kind: decision
        label: Surplus recall — colony flag 0x04 → clear, garrison_quota--, walk home
        fn: ai_euro.c:ai_euro_20e6_surplus_recall_arm
        dos: raw 85313-85337
        status: dos
      - id: explore
        kind: step
        label: Explorer — windowed ring scan (site nibble, fog, far-probe), else ring-hop 4 tiles on a latched direction
        fn: ai_euro.c:ai_euro_20e6_ring_hop
        dos: LAB_2912→2a59 ring scan; raw 2416-2458 ring hop (+0x3155/+0x3156)
        status: dos
        note: "bugs.md #683, ported 2026-09-23: the ring scan's own commit tail is now live. Raw 89272-89275 — `if (0 < local_c) { if (local_6a != 0) { if (best != own tile) goto LAB_521d_27f5; *(param_1 * 0x1c + 0x314c) = 7; goto LAB_521d_5a78; } }` — writes act_state 7 (UNITS_ORDER_BUILD_COLONY) when the best-scoring site is the tile the unit already stands on. It is the only AI writer of act_state 7 in the image, and it is what makes the two readers of that byte live: this scan's own raw-89182 reject (a candidate ring holding another unit already committed to 7 is skipped) and the human @TOONEARBUILD scan at raw 45670. 20e6 then returns 0 (raw 90445) and FUN_521d_5b66 dispatches its switch case 7 = FUN_1000_93ea = FUN_479b_076e (found colony) in the same call — ported as the act_state-7 consumer at the move-scoring-gate exit in ai_euro_unit_act, which calls ai_euro_found_with_unit. Port-only guard: a tile that refuses the colony resets the unit to act_state 5 rather than leaving it wedged behind 20e6's entry bail (raw 88404-88406)."
      - id: wander
        kind: step
        label: 8-direction wander scorer (stay = 8)
        fn: ai_euro.c:ai_euro_20e6_wander_step
