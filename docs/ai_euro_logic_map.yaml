        status: dos
        note: "Both inside the +0x1d bit 0x80 clear block, ahead of the carpenter arm. Forced-lumberjack (raw 94659-94679): gated on stock[lumber] < 10 and no lumberjack placed yet; three passes over unplaced slots (profession 5, any non-expert, anyone) calling 28c8 with forced job 5, looping while prod[lumber] == 0 so the FUN_281f_0c04 refresh ends it after one placement. No profession rewrite in this arm. Emergency buy (raw 94680-94689, ai_euro_5952_lumber_purchase): no lumberjack placed, stock[lumber] < 2 and turn (DS:0x538e) & 7 == 0 -> colony gains 100 lumber UNCONDITIONALLY, and the owner's purse is debited 200 only when it holds at least 200 (europe_nation_gold / europe_nation_gold_add)."
