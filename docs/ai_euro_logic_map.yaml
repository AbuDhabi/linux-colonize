# European AI logic map — machine-legible source of truth.
#
# Purpose: one file an LLM agent (or a human with grep) can read to learn how
# the ported European AI decides things each nation turn, without opening
# 20k lines of ai_euro.c. tools/ai_logic_map.py renders it as a flowchart for
# humans (HTML/Mermaid/DOT) and validates it against the source tree.
#
# Conventions
#   graphs[]        one flowchart each; `entry` is the first node id.
#   nodes[].kind    phase | step | decision | loop | call | sub | end
#                   sub = jump into another graph (`sub: <graph id>`).
#   nodes[].fn      "file:symbol" in src/core (validated by `check`).
#   nodes[].dos     DOS origin: FUN_seg_off + raw decompile lines when known.
#   nodes[].status  dos        = DOS-literal / byte-verified port
#                   structural = same control flow, some accessors substituted
#                   thin       = approximation of a DOS arm
#                   linux      = Linux-only mechanic, no DOS counterpart
#                   golden     = curve-fit to golden saves, not DOS evidence
#   edges[]         [from, to] or [from, to, "label"]; labels on decision
#                   edges are the branch condition.
#
# Keep node labels short; put the long story in `note`. Cite DOS raw lines
# and port_plan.md rows rather than restating them.

schema: euro-ai-logic-map/1
title: European AI logic map
date: 2026-09-15
sources:
  - src/core/ai.c            # ai_euro_nation_turn entry
  - src/core/ai_euro.c       # dispatcher, 5d04, 0a60, 20e6, 5b66 bodies
  - src/core/ai_goals.c      # goal tables (FUN_521d_0000..0906)
  - src/core/ai_diplo.c      # treaty timers, euro_balance, 13b0, 153e
  - src/core/ai_king.c       # crown beats reached from the Euro turn
  - src/core/turn.c          # TURN_PROC_EURO slice
  - docs/port_plan.md        # "Deferred AI track" inventory + status
  - original_sources_annotated/ai/*.md
how_to_read: |
  Start at graph `nation_turn`, follow `sub` nodes downward. The order of
  nodes inside a graph is execution order unless an edge label says
  otherwise. A `status: linux` node is a mechanic the port added (usually
  build-queue policy or golden-fit staging); everything else maps to a DOS
  FUN_521d_* body listed in docs/port_plan.md "FUN_* inventory".

graphs:

  # ---------------------------------------------------------------------
  - id: nation_turn
    title: Nation turn entry (TURN_PROC_EURO → FUN_521d_6d8e)
    entry: turn_slice
    nodes:
      - id: turn_slice
        kind: phase
        label: TURN_PROC_EURO slice — one AI Euro nation per advance
        fn: turn.c:TURN_PROC_EURO
        dos: FUN_130d_0290 year loop, control==1 branch (:6397)
        status: dos
        note: Slots above the human run before TURN_PROC_INDIAN, slots below after (DOS 130d order).
      - id: is_ref
        kind: decision
        label: Slot is the WoI crown (REF) nation?
        fn: turn.c:turn_euro_nation_is_ref
      - id: king_pre_beat
        kind: call
        label: REF pre-beat — wave spawn + war bookkeeping
        fn: ai_king.c:ai_king_ref_pre_euro_beat
        dos: FUN_43f7_* king beat (00f2→2424→2022), pure spawner
        status: dos
        note: D1 closed 2026-09-07g — crown slot then runs the full Euro turn like any AI nation.
      - id: nation_turn
        kind: phase
        label: ai_euro_nation_turn
        fn: ai.c:ai_euro_nation_turn
        dos: FUN_521d_6d8e entry
        status: structural
      - id: reseed
        kind: step
        label: Reseed RNG from timer word
        fn: ai.c:ai_nation_reseed
        dos: FUN_281f_04ca
        status: dos
        note: "--seed 100 overrides every timer-word read for deterministic runs."
      - id: scratch
        kind: call
        label: Rebuild planning scratch (needs-colonists count, census bytes, leader trait)
        fn: ai_goals.c:ai_goals_plan_scratch_refresh
        dos: 6d8e prelude raw 93109, 93139-93141 (DS:0xa0b8, FUN_4962_0018 bytes, DS:0x9567)
        status: dos
      - id: frigate
        kind: call
        label: "@KINGFRIGATE offer auto-accept"
        fn: ai_king.c:ai_king_frigate_offer
        dos: FUN_3844_00f2 tail
        status: dos
      - id: has_map
        kind: decision
        label: World map present?
      - id: dispatcher
        kind: sub
        label: Euro dispatcher (FUN_521d_6d8e body)
        sub: dispatcher
        fn: ai_euro.c:ai_euro_dispatcher_turn
      - id: end
        kind: end
        label: next nation / TURN_PROC_INDIAN / FINISH
        note: "Not in this graph: FUN_43f7_2244 (peacetime @MERCENARIES offer) — its caller FUN_281f_0668 is in the HUMAN arm of the year loop (raw 6418), ported 2026-09-15 as ai_king_peacetime_merc_offer at the TURN_PROC_KING tail. Until then the port ran an invented AI self-gift here."
    edges:
      - [turn_slice, is_ref]
      - [is_ref, king_pre_beat, "yes"]
      - [is_ref, nation_turn, "no"]
      - [king_pre_beat, nation_turn]
      - [nation_turn, reseed]
      - [reseed, scratch]
      - [scratch, frigate]
      - [frigate, has_map]
      - [has_map, dispatcher, "yes"]
      - [has_map, end, "no"]
      - [dispatcher, end]

  # ---------------------------------------------------------------------
  - id: dispatcher
    title: Dispatcher — ai_euro_dispatcher_turn (FUN_521d_6d8e)
    entry: reset
    nodes:
      - id: reset
        kind: step
        label: Reset per-turn shadow state
        fn: ai_euro.c:ai_euro_dispatcher_turn
        dos: FUN_521d_0a60 entry memset(0xa13c,0,16); housekeeping clears act_state 1/2/3 at :87560
        status: structural
        note: Sticky-unit counter, deferred-found, unloaded-this-turn, 0a60 pilot state, per-continent explorer count; wagon-errand / explore-fatigue / ring-hop latches of dead unit ids.
      - id: inventory
        kind: call
        label: Colony inventory — shortage tallies
        fn: ai_euro.c:ai_euro_colony_inventory
        dos: FUN_521d_5cf6-shaped tallies; FUN_5952_035e +0x8f/+0x8c increments
        status: structural
        note: "Per own colony tools<20, muskets<10, food<pop*2, ore<20, lumber-labor want; ++cargo_idle_turns, ++improve_timer. DOS's own loop (raw 93107-93135) is the 5952_035e tick + specialty/muskets/tools/horses demand tallies (0xa0cc/0xa0db/0xa0da/0xa0d4) and the NEEDS_COLONISTS count; the port's tallies here are Linux-shaped, the DOS ones live in ai_euro_5d04_cb_colony_needs / plan_scratch_refresh."
      - id: treaty_timers
        kind: call
        label: Treaty timers tick
        fn: ai_diplo.c:ai_diplo_treaty_timers
        dos: 6d8e prelude raw 93173-93188
        status: dos
        note: "Per peer — flag bit 0x08 set && timer==0 && RNG(0,3)==0 → clear 0x08|0x40 (PEACE) and set 0x01 WAR_INTENT (no timer write); then, independently, timer>0 decrements. Expiry breeds war intent, never peace. This is the ONLY DOS Euro→Euro war opener reachable from 6d8e — the WAR bit itself is set at the attack sites (465b etc.) once WAR_INTENT is up."
      - id: planning
        kind: sub
        label: Nation planning — treasury, ship buys, Europe hires
        sub: planning_5d04
        fn: ai_euro.c:ai_euro_nation_planning
      - id: promote
        kind: call
        label: Promote secondary goals to primary
        fn: ai_goals.c:ai_goals_promote_secondary_to_primary
        dos: FUN_521d_0342 — clear 64 primaries, upsert every live secondary
        status: dos
      - id: build_policy
        kind: step
        label: Build-queue policy (cancel stale, peace construction ladder, craft upgrades)
        fn: ai_euro.c:ai_euro_prefer_peace_construction
        status: linux
        note: ai_euro_cancel_stale_zero_hammer_builds, prefer_peace_construction (Stockade→Fort→Fortress→Warehouse→Docks, Drydock→Shipyard, Custom House, Church), prefer_all_buildings, prefer_craft_upgrades, clear_pre_stockade_build_queue.
      - id: goals
        kind: sub
        label: Goal writer — colony/unit goals (0a60 A–H)
        sub: goals_0a60
        fn: ai_euro.c:ai_euro_colony_goals
      - id: goal_orders
        kind: sub
        label: Goal consumption — assign each idle unit a primary goal
        sub: goal_orders
        fn: ai_euro.c:ai_euro_0a60_goal_orders_structural
      - id: is_crown
        kind: decision
        label: WoI crown slot?
      - id: balance
        kind: sub
        label: Euro diplomacy balance (war/peace rolls)
        sub: diplo_balance
        fn: ai_diplo.c:ai_diplo_euro_balance
        status: linux
        note: Linux-shaped pass with DOS pieces inside (10ec, 13b0); skipped for the crown because its peace arm would end the WoI.
      - id: unit_loop
        kind: loop
        label: "do { wave 0: Treasure/Artillery/Wagon; wave 1: all; ids high→low; first unit with MP drained, rescan } while wave 1 progressed && guard<64"
        fn: ai_euro.c:ai_euro_dispatcher_turn
        dos: 6d8e steps 6–7, raw 93237-93325
        status: structural
        note: "DOS shape ported 2026-09-15 (was ships-first, one act per unit per pass — a mislabelled type constant in the annotated header). Wave 0 = types 0x0a/0x0b/0x0c (bVar4), wave 1 = every unit; each wave scans ids high→low, takes the first unit with MP, acts it until MP==0, then leaves; the outer loop restarts from the top and returns when wave 1 found nobody. Port-only: a no-progress act marks the unit exhausted for the scan (DOS re-acts until the >0x14 sticky clear) and the guard<64 ceiling stays. AI_6D8E_DOS_LOOP=0 = legacy shape (bisect aid). Refit needed for the DOS order: SP soldier first-colony eligibility (both landed, ship still at the tip)."
      - id: skip
        kind: decision
        label: Skip? (inactive / other nation / aboard ship / land in wave 0)
      - id: no_mp
        kind: decision
        label: moves <= 0?
      - id: wake_elig
        kind: decision
        label: First-colony sentry wake eligible? (no colonies yet, Pioneer/Soldier, found-approach conditions)
        fn: ai_euro.c:ai_euro_06ae_first_colony_from_landfall
        status: golden
        note: Cite TURN3–5 goldens; soldier/pioneer wake rules keyed on landfall + found tile geometry.
      - id: sticky
        kind: decision
        label: Same unit acted > 0x14 times without progress?
        note: "Anti-spin. DOS (raw 93262-93268): DS:0x2d14 counts consecutive acts of the same unit; >0x14 → FUN_281f_0934 clears its orders and the unit is STILL acted. Port matches since 2026-09-15 (used to skip the unit)."
      - id: act
        kind: sub
        label: Unit act (5b66 dispatcher)
        sub: unit_act
        fn: ai_euro.c:ai_euro_unit_act
      - id: progressed
        kind: decision
        label: Progressed? (moved, spent MP, or despawned)
      - id: encounter
        kind: call
        label: Ended adjacent to the human → 153e audience
        fn: ai_diplo.c:ai_diplo_153e_encounter
        dos: FUN_5bfb_3180 on the moving unit's step; param_4 = AI unit arms @WANTSTUFF
        status: structural
        note: Per-act granularity vs DOS per-step; dedupes once per pair per turn.
      - id: ship_contact
        kind: step
        label: Treasure / Artillery / Wagon out of MP → ESCORT goal (code 2) prio 2 / 3 / 1 at its tile
        fn: ai_goals.c:ai_goals_upsert_primary
        dos: raw 93286-93298 (thunk_FUN_2a1f_0470(nation, x, y, 2, prio))
        status: dos
        note: "Ported 2026-09-15 as AI_GOAL_ESCORT (replaced the invented ship→CONTACT arm). Consumers per DS:0x523d bit 2 (k_20e6_type_flags 0x1c/0x3c/0x64): Soldiers, Dragoons, Regulars, Continentals, Cavalry, Scouts — no ship type. Consumption: 0a60 tail capability match → goto to the tile (drains MP like CONTACT); nothing special on arrival yet."
      - id: colony_tick
        kind: sub
        label: Colony tick — colonist re-placement (FUN_5952_035e)
        sub: colony_tick
        fn: ai_euro.c:ai_euro_colony_tick_28c8_reassign
      - id: end
        kind: end
        label: return
    edges:
      - [reset, inventory]
      - [inventory, treaty_timers]
      - [treaty_timers, planning]
      - [planning, promote]
      - [promote, build_policy]
      - [build_policy, goals]
      - [goals, goal_orders]
      - [goal_orders, is_crown]
      - [is_crown, balance, "no"]
      - [is_crown, unit_loop, "yes"]
      - [balance, unit_loop]
      - [unit_loop, skip]
      - [skip, unit_loop, "yes: next unit"]
      - [skip, no_mp, "no"]
      - [no_mp, wake_elig, "yes"]
      - [no_mp, sticky, "no"]
      - [wake_elig, sticky, "yes"]
      - [wake_elig, unit_loop, "no: next unit"]
      - [sticky, unit_loop, "yes: clear orders"]
      - [sticky, act, "no"]
      - [act, progressed]
      - [progressed, encounter, "yes"]
      - [progressed, ship_contact, "no"]
      - [encounter, ship_contact]
      - [ship_contact, unit_loop, "next unit"]
      - [unit_loop, colony_tick, "no unit acted or guard==64"]
      - [colony_tick, end]

  # ---------------------------------------------------------------------
  - id: planning_5d04
    title: Nation planning — FUN_521d_5d04 (treasury, ship buys, Europe hires)
    entry: treasury
    nodes:
      - id: treasury
        kind: step
        label: Treasury bump
        fn: ai_euro.c:ai_euro_5d04_treasury_bump
        dos: FUN_521d_5d04 head
        status: dos
      - id: flags
        kind: step
        label: Compute planning flags (college, frigate/privateer threat, no-clear-navy, cargo-short)
        fn: ai_euro.c:ai_euro_5d04_compute_flags
        dos: raw 85934-86024, 92412-92532
        status: dos
        note: WoI arm seizes the nation's Man-O-War into expeditionary_force (ai_euro_5d04_woi_seize_manowar). Threat crumbs are the 4962_0018 census tallies 0xa89a/0xa89b/0x9e52/0x9e54.
      - id: floors
        kind: step
        label: Apply naval gold floors (= 5c3c purchase prices per threat flag)
        fn: ai_euro.c:ai_euro_5d04_apply_naval_gold_floors
        status: dos
      - id: ladder_gate
        kind: decision
        label: WoI, or ship_cargo_totals > census_pop_proxy/2 + colony count?
        fn: ai_euro.c:ai_euro_5d04_ship_buy_ladder
      - id: frig
        kind: decision
        label: frigate_threatened? → buy Frigate (5000)
        fn: ai_euro.c:ai_euro_5d04_propose_ship_buy
        dos: "FUN_521d_5c3c purchase table DS:0x978d (Artillery 500 / Caravel 1000 / Merchantman 2000 / Galleon 3000 / Privateer 2000 / Frigate 5000); raw 92291-92300 post-spawn writes — +0x314d/e = nation+0x32/33 (return-from-Europe), +0x314c = 1 for land types / 0 for hulls (bugs.md #761)"
        status: dos
      - id: priv
        kind: decision
        label: privateer_threatened? → buy Privateer (2000)
      - id: rng_ladder
        kind: step
        label: RNG ladder — Frigate / Galleon / Merchantman / Caravel / Privateer
        fn: ai_euro.c:ai_euro_5d04_ship_buy_ladder
        status: dos
        note: "armed<8 && RNG(0,1)!=0 && no_clear_navy → Frigate; RNG(0,3)!=0 → Galleon; RNG(0,1)==0 && cargo<12 → Merchantman; cargo<3 → Caravel; armed<4 && RNG(0,3)==0 && no_clear_navy && !cargo_short → Privateer. First affordable wins."
      - id: abort
        kind: end
        label: Abort planning (threat buy failed) — hire tail skipped
        dos: raw 92541/92547 early return
      - id: hire_gate
        kind: decision
        label: Bought a ship OR nation already has ships? (raw 92568)
      - id: hire
        kind: phase
        label: Hire ladder tail (the DOS Europe hire economy)
        fn: ai_euro.c:ai_euro_5d04_hire_ladder_tail
        dos: raw 92568-93070
        status: dos
        note: "Recruit pop/refill (2026-09-18): a popped slot spawns its unit through the port's FUN_38fd_0718 counterpart ai_euro_5d04_cb_dock_pop_candidate, which now also writes the DOS sentry order (+0x314c = 1, raw 59133 — bugs.md #509); the emptied slot is refilled by europe.c's faithful FUN_38fd_46d4 (ai_euro_5d04_refill_pool_slot → europe_nation_refill_pool_slot, raw 64554-64694 — bugs.md #510), the difficulty-scaled tier roll off the shared game stream, replacing a flat dos_rng_range(0, 0x1b) stand-in that could seed the pool with professions 46d4 explicitly remaps away."
      - id: needs
        kind: step
        label: Colony musket/tool needs (DS:0xa0da/0xa0db, minus own Pioneers)
        fn: ai_euro.c:ai_euro_5d04_cb_colony_needs
        status: dos
      - id: arty
        kind: decision
        label: No Artillery on dock && muskets needed && RNG(0,3)==0 && !cargo_short && cargo totals>4 && !WoI?
        dos: raw 92569-92578
      - id: buy_arty
        kind: step
        label: Buy Artillery (500)
        fn: ai_euro.c:ai_euro_5d04_propose_ship_buy
      - id: swap
        kind: step
        label: Recruit-slot swap when gold >= price + reserve(census_pop_proxy)
        dos: raw 92592-92625
        status: dos
      - id: two_pass
        kind: loop
        label: Two-pass Europe dock candidate loop (unskilled pass, skilled pass); muskets-training arm
        dos: raw 86122-86306; LAB_521d_642a/6454
        status: dos
        note: Skips when any colony exists and (unit bit5 or turn%3==0). turn>99 Pioneer-training skip reads unit_type_counts[n][2].
      - id: demand
        kind: loop
        label: Colony demand vs purchase loop (demand query modes 4/0xc/0xe; goal trigger 0xb)
        dos: raw 86307-86479
        status: dos
        note: turn>0x50 crosses-bank delay counter; turn>0x27 price adjust (difficulty-10)*-100.
      - id: depart
        kind: loop
        label: Departing-ship loop — sell/bank hold, top up with the cargo colonies most want
        dos: raw 92983-93070
        status: dos
        note: Buys 100 of a cargo when its demand cell (DS:0xa0cc) exceeds Europe land units + turn parity; resets +0x314a=0xff on the ship; Missionary latch unit_type_counts[n][3]++.
      - id: end
        kind: end
        label: return
    edges:
      - [treasury, flags]
      - [flags, floors]
      - [floors, ladder_gate]
      - [ladder_gate, hire_gate, "yes: no candidate"]
      - [ladder_gate, frig, "no"]
      - [frig, priv, "not threatened / bought"]
      - [frig, abort, "threatened, buy failed"]
      - [priv, rng_ladder, "not threatened / bought"]
      - [priv, abort, "threatened, buy failed"]
      - [rng_ladder, hire_gate]
      - [hire_gate, hire, "yes"]
      - [hire_gate, end, "no: shipless and bought nothing"]
      - [hire, needs]
      - [needs, arty]
      - [arty, buy_arty, "yes"]
      - [arty, swap, "no"]
      - [buy_arty, swap]
      - [swap, two_pass]
      - [two_pass, demand]
      - [demand, depart]
      - [depart, end]

  # ---------------------------------------------------------------------
  - id: goals_0a60
    title: Goal writer — ai_euro_colony_goals (FUN_521d_0a60 sections A–H)
    entry: clear_wq
    nodes:
      - id: clear_wq
        kind: step
        label: Clear work queue (16 slots)
        fn: ai_goals.c:ai_goals_clear_work_queue
        dos: FUN_521d_031c
        status: dos
      - id: sec_a
        kind: step
        label: "A: urgency seed; coarse-plane wipe + restamp"
        dos: FUN_1d1d_0dae(0x9faa,0,0x10e)
        status: structural
      - id: housekeeping
        kind: call
        label: Unit housekeeping — +0x3148 bits, act-state transitions, foreign-ship CONTACT
        fn: ai_euro.c:ai_euro_0a60_unit_housekeeping
        dos: 0a60 raw lines 1-189
        status: dos
        note: FOUND/MIL_EXPAND eligibility (bits 2/3) from 0d38 stack counts (military ≥2 or mobilizable → bits 2+3; Pioneers → bit 2); spare-transport bit5 (one ship per nation per turn); act_state 1/2/3 → 0 on tile, 10 at a contact claim, 1 when aboard/off-map; foreign hostile ship → CONTACT prio 3 (Frigates only post-declaration).
      - id: sec_b
        kind: loop
        label: "B: own land units — adjacent foreign unit → CONTACT prio 3"
        fn: ai_goals.c:ai_goals_upsert_primary
        dos: 0a60 unit loop thunk_FUN_2a1f_0470
        status: dos
      - id: ship_reset
        kind: step
        label: Reset ship-pressure tallies
        fn: ai_euro.c:ai_euro_ship_pressure_reset
        dos: FUN_4962_0018 raw 78239-78242
        status: dos
      - id: sec_d
        kind: loop
        label: "D: own colony loop"
        fn: ai_euro.c:ai_euro_colony_goals
        dos: 0a60 colony loop raw 190-980
        status: structural
      - id: d_flags
        kind: call
        label: Refresh colony ai_flags — ship probe, field tallies, NEEDS_COLONISTS, WANTS_PIONEER_WORK
        fn: ai_euro.c:ai_euro_refresh_colony_ai_flags
        dos: FUN_4962_0018 phase-3 ship probe (blockade bits 0x01/0x02); FUN_5952_035e raw 94200-94206, 555-563
        status: dos
      - id: d_absorb
        kind: call
        label: Absorption arm (tile re-scan) + equip arm + the five FUN_5952_0306 build-preference calls - FUN_5952_035e raw 94231-94395
        dos: FUN_5952_035e raw 94231-94395 (annotated colony_tick_5952_035e.md:594-793)
        dos: FUN_5952_035e raw 94231-94352 (annotated colony_tick_5952_035e.md:594-719)
        status: dos
        note: "RE-HOSTED 2026-09-18 out of the unit act into the colony tick, at DOS's position: after every +0x1b flag write and the by-profession census, before the build-preference / construction cascade. Absorption is a TILE RE-SCAN with DOS's loop semantics — outer gate `DS:0x8d72 != 0 && (+0x1b & 0x10)`, inner scan over the colony slots past +0x1f, at most one take-in per pass (iStack_32) and restart from the top, `+0x1f < 0x20` re-read at every loop test. local_ee is FUN_15eb_0902 = DS:0x30e[@UNIT type], the type's DEFAULT @JOB (units_type_default_job), NOT the @UNIT code: 0x13 Colonist (unconditional), 0x14 Pioneer ((+0x1b & 0x80) && local_16 == 0, or G-stance 0), 0x15/0x17 Soldier/Dragoon ((a) iStack_76 < 0 && !(+0x1b & 8) — a dead branch — or (b) an expert other than @JOB 0x15 with census aiStack_68[0x13]/[0x15] non-zero, or (c) +0x1b & 4), 0x16 Scout (G-stance 0 or stock[horses] < 0x34). Admission is colonies_admit_unit_w (FUN_15eb_1068 job 0x12): equipment refunded to stock, profession kept. The Soldier case also ++s the tick-local iStack_76, clears +0x1b bit 2 and consumes one census cell ([0x15] first). local_16 is a real tick-local seeded from `0x13 < +0xb6` and latched by the Pioneer case. Equip arm (raw 94276-94352): pop > 1; local_90 = G-stance 0 && pop > 10 && dos_rng_range(0,3) == 0 && !(+0x1b & 0x10) — drawn once per AI colony per turn, which is where the shared LCG stream now sees it; ((+0x1b & 0x48) || local_90) && stock[muskets] > 0x31; target 0x15, or 0x17 on stock[horses] > 0x33; ai_euro_5952_equip_pick scores the colonist, the expert strip reads DOS's leaked loop variable (colonist pop-1), then colonies_eject_colonist. COMPLETED 2026-09-18: all THREE local_136 targets are live and share local_8e, so a later arm overrides an earlier one and at most one re-type happens per tick - Scout (raw 94277-94285: stock[horses] > 0x65, then pop < 10 && pop < FUN_1000_8e6c() = ai_euro_colony_wanted_size skips THIS ARM ONLY, then !(+0x1b & 0x10); scorer 