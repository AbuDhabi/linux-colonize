        status: dos
        note: "bugs.md #523 REFUTED 2026-09-18e. ai_euro_20e6_attack_term's Soldier/Dragoon colony-mass gate (raw 88921-88937) returns 'skip this tile' and the caller `continue`s to the next direction; that IS DOS. `goto LAB_521d_5183` is the direction loop's own increment: viceroy_overlays.asm `LAB_OVL14_L0000__0054b0 CMP [BP+0xff28],AX / JL 0054b5 / JMP 005183` and `LAB_OVL14_L0000__005183 = INC word ptr [BP-0x4e]`, immediately followed by `LAB_..__005186 CMP [BP-0x4e],0x8 / JL 00518f` — the loop counter bump and test, with 14 XREFs (every unscoreable-direction arm in the scorer jumps there). No abandonment of the 8-direction scan anywhere."
      - id: surplus_tail
        kind: decision
        label: "Surplus garrison (local_8e) whose scan picked no attack → back to the garrison hold"
        dos: FUN_521d_20e6 raw 88982-88984 (LAB_4d2e tail, `local_ce == 0` → `local_8e != 0` → LAB_5888)
        status: dos
        note: "Ported 2026-09-18e (bugs.md #522). The raw 88612 surplus entry only buys the unit one free-scored attack: with local_ce clear it drops back into LAB_5888 — colony.labor_shortage--, order_code 0x47, stay. It also suppresses the 0x46 park arm below, which reads local_8e == 0 at raw 88985."
