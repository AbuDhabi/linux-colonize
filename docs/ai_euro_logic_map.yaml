  # ---------------------------------------------------------------------
  - id: diplo_balance
    title: Euro diplomacy balance — ai_diplo_euro_balance (+ FUN_5bfb_10ec / 13b0)
    entry: indian_tick
    nodes:
      - id: indian_tick
        kind: step
        label: Indian relation matrix tick
        fn: ai_diplo.c:ai_diplo_indian_matrix_tick
        status: linux
      - id: peer_loop
        kind: loop
        label: Each Euro peer (skip self and control==2 slots)
        fn: ai_diplo.c:ai_diplo_euro_balance
      - id: at_war
        kind: decision
        label: At war with this peer?
      - id: franklin
        kind: decision
        label: Franklin held?
        note: Europeans in the New World always offer peace — conclude peace (AI→human enqueues CHOICE).
      - id: upkeep
        kind: step
        label: War upkeep drain (5 gold/turn per war peer)
        fn: ai_diplo.c:ai_diplo_war_upkeep_drain
        status: linux
        note: No DOS per-turn war gold drain exists; 153e's stings are one-shot audience outcomes.
      - id: privateer
        kind: step
        label: Wartime Privateer spawn (or prize gold when no unit pool)
        fn: ai_diplo.c:ai_diplo_war_privateer_spawn
        status: linux
      - id: fatigue
        kind: decision
        label: Near parity, timer 0, RNG(1,30)==1 → war-fatigue peace?
        status: linux
      - id: eligible
        kind: decision
        label: self > 2×other + edge && self > war-min? (10ec war-worthy)
        fn: ai_euro.c:ai_euro_10ec_war_worthy
        dos: FUN_5bfb_10ec
        status: dos
      - id: declare
        kind: step
        label: "RNG(1,20)==1 → declare war (human peer gets a CHOICE popup)"
        fn: ai_diplo.c:ai_diplo_declare_war_ctx
        status: linux
        note: "Second, Linux-only war opener. DOS AI→Euro war starts only via WAR_INTENT (treaty_timers) followed by an attack site setting WAR, or 13b0's paid @SMITE. 10ec itself is a pure eligibility predicate in DOS."
      - id: treaty
        kind: call
        label: Treaty sign / cancel tick (requires an encounter this turn; (a+turn+b)%3 cadence)
        fn: ai_diplo.c:ai_diplo_13b0_treaty_tick
        dos: FUN_5bfb_13b0
        status: dos
        note: Unworthy pair without PEACE → sign PEACE + wake border garrisons; worthy pair with PEACE → cancel (@CANCELTREATY missing in GAME.TXT).
      - id: end
        kind: end
        label: return
    edges:
      - [indian_tick, peer_loop]
      - [peer_loop, at_war]
      - [at_war, franklin, "yes"]
      - [franklin, peer_loop, "yes: make peace"]
      - [franklin, upkeep, "no"]
      - [upkeep, privateer]
      - [privateer, fatigue]
      - [fatigue, peer_loop, "yes: peace offer"]
      - [fatigue, treaty, "no"]
      - [at_war, eligible, "no"]
      - [eligible, declare, "yes, not Franklin"]
      - [eligible, treaty, "no"]
      - [declare, treaty]
      - [treaty, peer_loop, "next peer"]
      - [peer_loop, end, "done"]

