  - id: colony_tick
    title: Colony tick — ai_euro_colony_tick_28c8_reassign (FUN_5952_035e placement section)
    entry: loop
    nodes:
      - id: loop
        kind: loop
        label: Each own colony with colonists (AI nations only — DOS has one call site, inside 6d8e)
        fn: ai_euro.c:ai_euro_colony_tick_28c8_reassign
        dos: FUN_5952_035e via 2a1f_0530 → 521d_5cf6 → 2a1f_05a8 — raw 93119, inside the PRELUDE colony loop
        status: dos
        note: "ORDER DIVERGES: DOS runs the tick per colony in the 6d8e prelude (before 5d04 / 0342 / 0a60 and before any unit acts), so planning reads post-tick colony state. The port runs it last on purpose (w31-28c8 2026-08-29: the Linux expert field-assign arm needs a free tile first). Body is DOS; position is Linux."
      - id: pass1
        kind: loop
        label: "Pass 1 — food: re-score the slots that were feeding the colony until food_have ≥ food_need"
        fn: ai_euro.c:ai_euro_28c8_score_job
        dos: FUN_15eb_28c8 job scorer (9-job formula); colony+0x9a food stock
        status: dos
      - id: pass2
        kind: loop
        label: Pass 2 ×2 — everyone else, best job wins (raw 94613-94614 stop)
        status: dos
      - id: lumber
        kind: loop
        label: Forced-lumberjack pass + AI emergency lumber buy — the two arms that feed the carpenter gate
        fn: ai_euro.c:ai_euro_5952_lumberjack_pick
        dos: FUN_5952_035e raw 94659-94689 (annotated colony_tick_5952_035e.md:1074-1112)
        status: dos
        note: "Both inside the +0x1d bit 0x80 clear block, ahead of the carpenter arm. Forced-lumberjack (raw 94659-94679): gated on stock[lumber] < 10 and no lumberjack placed yet; three passes over unplaced slots (profession 5, any non-expert, anyone) calling 28c8 with forced job 5, looping while prod[lumber] == 0 so the FUN_281f_0c04 refresh ends it after one placement. No profession rewrite in this arm. Emergency buy (raw 94680-94689, ai_euro_5952_lumber_purchase): no lumberjack placed, stock[lumber] < 2 and turn (DS:0x538e) & 7 == 0 -> colony gains 100 lumber UNCONDITIONALLY, and the owner's purse is debited 200 only when it holds at least 200 (europe_nation_gold / europe_nation_gold_add)."
      - id: carpenter
        kind: loop
        label: Carpenter-staffing arm — four passes for one Carpenter's House worker when the colony has lumber but no hammers
        fn: ai_euro.c:ai_euro_5952_carpenter_pick
        dos: FUN_5952_035e raw 94690-94740, asm 5952:1ac7-5952:1be2
        status: dos
        note: "Gated on +0x1d bit 0x80 clear and stock[lumber] + prod[lumber] > 1; loops while prod[hammers] == 0, so the ledger refresh (FUN_281f_0c04) after the first assignment ends it. Passes: profession 0x0d, 0x1c, 0x19, anyone. A chosen Servant/Criminal is rewritten to Free Colonist (FUN_281f_0cae(slot, 0x1c)); a non-expert in a colony with no Master Carpenter and pop > 5 may be handed the Master Carpenter specialty on a FUN_281f_04d4(0, 0x10 - difficulty) == 0 roll. The same block's two preceding arms (forced-lumberjack, emergency lumber buy) run first — see node `lumber`."
      - id: expert
        kind: step
        label: Expert workplace fix-ups; origin refresh
        fn: ai_euro.c:ai_euro_5952_job_is_expert
        status: dos
      - id: indoor
        kind: loop
        label: Indoor-workplace pass — elect one indoor @JOB per still-unplaced slot
        fn: ai_euro.c:ai_euro_5952_indoor_pass
        dos: FUN_5952_035e raw 94784-94860, asm 5952:1ef7-5952:2193
        status: dos
        note: "Per unplaced slot: 28c8 mode-2 probe (DS:0x8dc0/0x8dbe) for the best plot, then score every available indoor job 9..0x11 as (producible*8+5)*want_weight (ai_euro_5952_want_weight / ai_euro_5952_job_score; producible = ai_euro_5952_producible, the 15eb:1f44 dispatcher over colony_production.c's ported 1d4c bodies). Indoor winner beats the plot score -> assign the workplace; else commit the plot; else ai_euro_5952_fallback_job (Carpenter, or Preacher on Church + lumber surplus + <3 preachers). AI_5952_INDOOR=0 restores the pre-2026-09-17 leftovers field stand-in."
      - id: build
        kind: loop
        label: Construction-project cascade — one ordered chain of FUN_5952_0214 tries ending in five unit projects
        fn: ai_euro.c:ai_euro_5952_build_cascade
        dos: FUN_5952_035e asm 5952:21d4-5952:274b (viceroy_overlays.asm:145550-146167); FUN_5952_0214 / 0280 / 02f4
        status: dos
        note: "bugs.md #483. Prologue clears +0x1d bit 0x80 and sets +0x94 = 0xff, then tries @BUILDING ids in DOS order — 6, 0, 0x11, [pop<4 stop], 0x10, 0x12, {unit 0xc Wagon Train}, 0xc, 3, 0x25, 0x24, 1, 0x28, 0x10, 0x14, 0x14, 0xd, [pop<8 stop], 0xe, 0x25, 2, then the naval band (full craft chain + COASTAL: 8, then unit 0xf Galleon / 0x10 Privateer / 0x11 Frigate from the census), the Artillery arm (unit 0xb), the six-chain FUN_5952_0280 upgrade loop, 0x26, the 26e4 ship arms, the +0x1c 0x10 SMALL_AI writer and the unit-0xb tail. FUN_5952_0214 recurses on the DS:0x8f85 predecessor; FUN_5952_02f4 writes code = row + 0x1f with no gate of its own. Trace AI_5952_BUILD_TRACE=1. POSITION: the port runs it right after ai_euro_colony_goals (which produces the ring-1 threat count it reads), not in the 28c8 body."
      - id: end
        kind: end
        label: return
    edges:
      - [loop, pass1, "each colony"]
      - [pass1, pass2]
      - [pass2, lumber]
      - [lumber, carpenter]
      - [carpenter, expert]
      - [expert, indoor]
      - [indoor, build]
      - [build, loop, "next colony"]
      - [loop, end, "done"]
