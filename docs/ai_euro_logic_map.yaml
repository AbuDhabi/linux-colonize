        dos: FUN_5952_035e raw ~95860-95958 (md:1653-1749); asm viceroy_overlays.asm OVL15 0x274b-0x29ff
        status: dos
        note: "bugs.md #571/#572, ported 2026-09-22. Counts taken at md:1459-1464: food_workers = count-by-JOB(0)+(8) (FUN_1000_8d72), food_experts = count-by-PROFESSION(0)+(8) (FUN_1000_8de0); train_flag = (pop/2 < food_workers && food_workers > 1) || DS:0x8e5a != 0 (colony short of food). ARM 1 (0x274b): school chain 0xc owned and ((count==3)+count)*4 <= improve_timer; target = 8 if census[8] < water ring tiles else 0 when pop < 10 && food_experts <= food_workers, then the DS:0x864 6-row table (recovered from VICEROY.EXE at EXE 121248+0x864: {building, @JOB, input @CARGO, @JOB} = {3,f,e,f} {27,e,6,e} {20,c,4,c} {1b,9,1,9} {18,a,2,a} {15,b,3,b}) overrides it for a craft whose chain is built out (2 tiers; 1 for Armory root 3), whose input cargo is being produced and whose @JOB the colony lacks — and DOS writes the ROW INDEX, not the row's @JOB (asm 0x2830), a DOS bug kept literal, so the override elects @JOB 0..5. Candidates = non-experts, or experts working off-specialty (occupation != 0x13), Converts excluded, cap 25; RNG pick, profession written, improve_timer = 0. ARM 2 (0x290c): train_flag && nation tax_rate (DS:0x84fc+1) <= 0x19 && purse >= @JOB row 0 price (NAMES.TXT column 3 = 1100) -> last non-expert non-Convert becomes Expert Fisherman (no Fisherman + Docks) else Expert Farmer (no Farmer); ai_euro_5952_train_pick. The gold debit reads @JOB[COLONIST SLOT] (asm 0x29d4 `MOV BX,[BP-0x2e]; SHL BX,3; MOV AX,[BX+0x8ea8]; CWD`) — DOS charges the price row indexed by the slot, kept literal. bugs.md #586: train_flag is forced to 0 when the build cascade committed Docks for this colony this tick (ai_euro_5952_docks_started). Deviation: DOS's ARM 1 candidate walk runs to pop + DS:0x8d72 (into units parked on the colony tile) and its census is the pre-absorption snapshot; the port walks the colony roster and recomputes."
      - id: build
        kind: loop
        label: Construction-project cascade — one ordered chain of FUN_5952_0214 tries ending in five unit projects
        fn: ai_euro.c:ai_euro_5952_build_cascade
