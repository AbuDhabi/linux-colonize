name: release-macos

# Builds the macOS (Apple Silicon) zip with scripts/build_release_macos.sh.
# The build job has read-only access; only the small release job, which runs no
# repository code, gets contents: write.
# Published release: the zip is attached to that release.
# Manual run: the zip is kept as a workflow artifact only.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: brew install cmake pkgconf sdl2 glib dylibbundler

      - name: Build package
        run: bash scripts/build_release_macos.sh

      - name: Keep zip as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencol-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  attach:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opencol-macos-arm64

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ./*.zip --clobber --repo "$GITHUB_REPOSITORY"
